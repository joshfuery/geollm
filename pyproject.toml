[project]
name = "geoagentbench"
version = "0.1.0"
description = "A benchmark measuring how well LLM agents reason over real terrain."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Josh Fuery", email = "joshfuery@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
]
solvers = [
    "ortools>=9.10",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
geoab = "geoagentbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoagentbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
